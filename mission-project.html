<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08090c" />
  <title>Viewgraph · Project</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#08090c; --surface:#111318; --s2:#181b21; --fg:#eceae4;
      --muted:#8a8e96; --subtle:#6a6e76; --border:#2a2d33; --strong:#3c414a;
      --live:#7f9d8a; --warn:#c4a574;
      --pad: max(16px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; background:var(--bg); color:var(--fg);
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif; }
    main {
      max-width: 920px; margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) var(--pad) calc(48px + env(safe-area-inset-bottom));
    }
    h1 { font-family: Georgia, "Iowan Old Style", serif; font-style: italic; font-weight:400;
      font-size: clamp(1.7rem, 6vw, 2.1rem); margin: 4px 0 8px; }
    h2 { font-family: Georgia, "Iowan Old Style", serif; font-style: italic; font-weight:400;
      font-size: 1.25rem; margin: 8px 0; }
    .kicker { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
      letter-spacing: .12em; text-transform: uppercase; color: var(--subtle); }
    .lead { color: var(--muted); max-width: 40rem; font-size: 15px; }
    .grid { display:grid; gap: 12px; margin-top: 20px; }
    @media (min-width: 800px) { .split { grid-template-columns: 1.05fr .95fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .chips { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 8px; }
    button.chip, label.chip {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; text-align:left; cursor:pointer;
      min-height: 44px; font: inherit; color: inherit;
    }
    button.chip.on, label.chip.on { background: var(--s2); color: var(--fg); border-color: var(--strong); }
    button.chip small, label.chip small {
      display:block; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px; color: var(--subtle);
    }
    .stats { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
    .stat { border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; }
    .stat b { display:block; font-family: Georgia, serif; font-style:italic; font-size: 1.5rem; }
    .tick { display:flex; justify-content:space-between; gap:12px; border:1px solid var(--border);
      border-radius:8px; padding:10px 12px; margin-top:8px; }
    .badge { display:inline-block; border:1px solid var(--border); border-radius:999px;
      padding:4px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .badge.extract { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
    .badge.move, .badge.hold { color: var(--live); }
    ul { margin: 8px 0 0; padding: 0 0 0 18px; color: var(--muted); }
    .shots { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:10px; padding-bottom:4px; }
    .shots img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border:1px solid var(--border); flex: 0 0 auto; }
    input[type=file] { display:none; }
    .status { margin-top: 8px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Viewgraph · Q-SIM field clock</p>
    <h1>Project the next minutes</h1>
    <p class="lead">Works on this phone and on the desktop. Weather, land, movement, load, and injury set the clock. Not a live weather feed and not a medical device.</p>

    <section class="card" style="margin-top:16px">
      <p class="kicker">Field stills</p>
      <p class="status" id="shotStatus">No photo yet. Use the camera or the library.</p>
      <div class="chips">
        <label class="chip" for="cam">Take photo<small>Rear camera</small></label>
        <label class="chip" for="lib">From library<small>JPEG only</small></label>
      </div>
      <input id="cam" type="file" accept="image/*" capture="environment" />
      <input id="lib" type="file" accept="image/jpeg,image/png" multiple />
      <div class="shots" id="shots"></div>
    </section>

    <div class="grid split">
      <section class="card" id="controls"></section>
      <aside class="card" id="out"></aside>
    </div>
    <section class="card" style="margin-top:12px" id="why"></section>
  </main>
  <script>
    const WEATHERS = [["clear","Clear","Day sight"],["fog","Fog","Short vis"],["rain","Rain","Wet ground"],["snow","Snow","Cold + slip"],["heat","Heat","Load cost"],["night","Night","No ambient"]];
    const LANDS = [["confined","Confined","Room / stair"],["urban","Urban","Street + cover"],["rural","Rural","Open field"],["mountain","Mountain","Slope"],["desert","Desert","Exposure"]];
    const MOVES = [["static","Hold","No displacement"],["crawl","Crawl","Low profile"],["walk","Walk","Upright"],["bound","Bound","Dash + cover"],["vehicle","Vehicle","Wheeled"]];
    const LOADS = [["light","Light","No drag"],["kit","Kit","Full fighting load"],["casualty","Casualty","One-person drag"]];
    const INJURIES = [["none","None","Able"],["hemorrhage","Hemorrhage","Time-critical"],["airway","Airway","Breath"],["fracture","Fracture","Limb"],["shock","Shock","Perfusion"],["burn","Burn","Surface"]];
    const state = { weather:"night", land:"confined", move:"static", load:"casualty", injuries:["hemorrhage"], horizon:15 };
    const shots = [];

    const W = { clear:[0,8,0,"Sight is open."], fog:[8,-6,4,"Short visibility slows finding and landing."], rain:[10,4,3,"Wet ground cuts traction and delays a stretcher."], snow:[16,6,6,"Cold and slip add time to every bound."], heat:[12,10,2,"Heat taxes the carrier more than the ground."], night:[10,-4,5,"No ambient light. Movement is slower and quieter."] };
    const L = { confined:[18,-10,8,"Stairs and doors cap the evac team."], urban:[6,4,2,"Cover exists. Crossings cost time."], rural:[4,14,3,"Open ground. Fast if the weather holds."], mountain:[20,8,10,"Slope and altitude stretch every metre."], desert:[10,18,4,"No cover. Heat and sight lines dominate."] };
    const M = { static:[0,-8,"Holding. Exposure drops if cover is real."], crawl:[14,-12,"Low profile. Distance per minute is small."], walk:[6,8,"Upright. Faster, more visible."], bound:[10,2,"Dash then cover. Sustainable only in short hops."], vehicle:[-8,10,"Wheeled speed if the land accepts a vehicle."] };
    const LD = { light:[0,0,"No drag."], kit:[8,1,"Fighting load slows a stair or a slope."], casualty:[22,6,"One-person drag. Two people change the clock."] };
    const I = { hemorrhage:[16,16,2.4,"Bleeding is the clock. Minutes, not hours."], airway:[20,16,2.8,"Airway first. Movement waits on a patent breath."], fracture:[14,4,0.4,"A limb fracture cuts self-move, not the evac window as fast."], shock:[18,8,1.6,"Perfusion falling. Load and heat make it worse."], burn:[10,5,0.8,"Surface injury. Fluid and exposure matter more than speed."] };
    const clamp = (n,a,b) => Math.max(a, Math.min(b,n));

    function project() {
      const w = W[state.weather], l = L[state.land], m = M[state.move], ld = LD[state.load];
      let injuries = state.injuries.filter((x,i,a)=>a.indexOf(x)===i);
      if (injuries.includes("none") && injuries.length>1) injuries = injuries.filter(x=>x!=="none");
      if (!injuries.length) injuries = ["none"];
      let mobility = 100 - w[0] - l[0] - Math.max(0,m[0]) - ld[0];
      if (state.move==="vehicle" && (state.land==="confined"||state.land==="mountain")) mobility -= 24;
      if (state.move==="vehicle") mobility += 8;
      let exposure = clamp(w[1]+l[1]+m[1],0,100);
      let evac = 15 + w[2] + l[2] + ld[1];
      const reasons = [w[3], l[3], m[2], ld[2]];
      let decay = 0;
      for (const id of injuries) {
        if (id==="none") { reasons.push("No recorded injury. The clock is the terrain."); continue; }
        const c = I[id]; mobility -= c[0]; evac -= c[1]; decay += c[2]; reasons.push(c[3]);
      }
      if (injuries.includes("hemorrhage") && state.weather==="heat") { decay += 0.6; reasons.push("Heat plus bleeding shortens perfusion."); }
      if (injuries.includes("shock") && state.load==="casualty") { decay += 0.5; reasons.push("Dragging a casualty in shock spends the reserve."); }
      if (state.land==="confined" && (injuries.includes("airway")||injuries.includes("hemorrhage"))) { evac -= 3; reasons.push("Confined structure delays a litter team."); }
      mobility = clamp(Math.round(mobility),4,100);
      exposure = clamp(Math.round(exposure),0,100);
      evac = clamp(Math.round(evac),4,40);
      const ticks = [0,5,15,30].filter(t=>t<=state.horizon).map(at => {
        const mob = clamp(Math.round(mobility - decay*at),2,100);
        let note = "Stable enough to hold.";
        if (mob < 35) note = "Self-move is gone. Carry only.";
        else if (mob < 55) note = "Short bounds only.";
        else if (exposure > 70) note = "Exposed. Cover before distance.";
        return { at, mobility: mob, note };
      });
      const future = clamp(Math.round(mobility - decay*state.horizon),2,100);
      let band = "hold", action = "Hold cover. Recheck in five minutes.";
      if (injuries.includes("airway") || injuries.includes("hemorrhage")) { band="extract"; action = `Start extract now. Window about ${evac} min if the bleed and airway stay controlled.`; }
      else if (future < 40 || evac <= 10) { band="extract"; action = `Extract inside ${evac} min. Mobility falls through this horizon.`; }
      else if (state.move!=="static" && future>=55 && exposure<75) { band="move"; action = `Move on this line. Recheck at +${Math.min(15,state.horizon)} min.`; }
      else if (exposure>=75) { band="move"; action = "Leave the open ground first. Then hold."; }
      return { mobility: future, exposure, evac, band, action, reasons, ticks };
    }

    function chips(key, rows, multi) {
      return rows.map(([id,name,kick]) => {
        const on = multi ? state.injuries.includes(id) : state[key]===id;
        return `<button type="button" class="chip ${on?"on":""}" data-k="${key}" data-id="${id}"><span>${name}</span><small>${kick}</small></button>`;
      }).join("");
    }

    function renderShots() {
      const box = document.getElementById("shots");
      const status = document.getElementById("shotStatus");
      box.innerHTML = shots.map(url => `<img src="${url}" alt="field still">`).join("");
      status.textContent = shots.length
        ? shots.length + " still" + (shots.length>1?"s":"") + " on this device. COLMAP still uses C:\\\\Jobs\\\\crate\\\\frames on the PC."
        : "No photo yet. Use the camera or the library.";
    }

    function render() {
      document.getElementById("controls").innerHTML = `
        <p class="kicker">Weather</p><div class="chips">${chips("weather", WEATHERS)}</div>
        <p class="kicker" style="margin-top:14px">Land</p><div class="chips">${chips("land", LANDS)}</div>
        <p class="kicker" style="margin-top:14px">Movement</p><div class="chips">${chips("move", MOVES)}</div>
        <p class="kicker" style="margin-top:14px">Load</p><div class="chips">${chips("load", LOADS)}</div>
        <p class="kicker" style="margin-top:14px">Injury</p><div class="chips">${chips("injuries", INJURIES, true)}</div>
        <p class="kicker" style="margin-top:14px">Horizon</p><div class="chips">${[5,15,30].map(h=>`<button type="button" class="chip ${state.horizon===h?"on":""}" data-k="horizon" data-id="${h}"><span>${h} min</span><small>Look ahead</small></button>`).join("")}</div>`;
      const r = project();
      document.getElementById("out").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><p class="kicker">At +${state.horizon} min</p><span class="badge ${r.band}">${r.band}</span></div>
        <h2>${r.action}</h2>
        <div class="stats">
          <div class="stat"><span class="kicker">Mobility</span><b>${r.mobility}</b></div>
          <div class="stat"><span class="kicker">Exposure</span><b>${r.exposure}</b></div>
          <div class="stat"><span class="kicker">Evac min</span><b>${r.evac}</b></div>
        </div>
        ${r.ticks.map(t=>`<div class="tick"><div><p class="kicker">+${t.at} min</p><div style="color:var(--muted);font-size:13px">${t.note}</div></div><div>${t.mobility}</div></div>`).join("")}`;
      document.getElementById("why").innerHTML = `<p class="kicker">Why this clock</p><ul>${r.reasons.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    }

    document.body.addEventListener("click", (e) => {
      const b = e.target.closest("button.chip");
      if (!b) return;
      const k = b.dataset.k, id = b.dataset.id;
      if (k==="injuries") {
        if (id==="none") state.injuries = ["none"];
        else {
          const cur = state.injuries.filter(x=>x!=="none");
          state.injuries = cur.includes(id) ? (cur.filter(x=>x!==id).length?cur.filter(x=>x!==id):["none"]) : [...cur, id];
        }
      } else if (k==="horizon") state.horizon = Number(id);
      else state[k] = id;
      render();
    });

    function addFiles(list) {
      [...list].slice(0, 16 - shots.length).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        shots.push(URL.createObjectURL(file));
      });
      renderShots();
    }
    document.getElementById("cam").addEventListener("change", e => addFiles(e.target.files));
    document.getElementById("lib").addEventListener("change", e => addFiles(e.target.files));

    render();
    renderShots();
  </script>
</body>
</html>
